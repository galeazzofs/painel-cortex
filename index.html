<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Campanha Cortex · Painel Executivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #FAFAF9;
    --surface: #FFFFFF;
    --surface-2: #F5F5F4;
    --border: #E7E5E4;
    --border-strong: #D6D3D1;
    --text-1: #0C0A09;
    --text-2: #44403C;
    --text-3: #78716C;
    --text-4: #A8A29E;
    --accent: #1F5F3F;
    --accent-soft: #E8F2EC;
    --positive: #15803D;
    --negative: #991B1B;
    --negative-soft: #FEF2F2;
    --warning: #92400E;
    --warning-soft: #FEF3C7;
    --shadow-sm: 0 1px 2px rgba(12, 10, 9, 0.04);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg); color: var(--text-1);
    font-family: 'Geist', -apple-system, sans-serif;
    font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
  }
  .serif { font-family: 'Fraunces', Georgia, serif; font-weight: 400; letter-spacing: -0.02em; }
  .mono  { font-family: 'Geist Mono', monospace; }

  .app { max-width: 1320px; margin: 0 auto; padding: 32px 40px 80px; }

  /* LOADING */
  .state-screen { min-height: 60vh; display: grid; place-items: center; text-align: center; }
  .state-screen .title { font-family: 'Fraunces', serif; font-size: 28px; color: var(--text-2); margin-bottom: 8px; }
  .state-screen .sub   { color: var(--text-3); font-size: 14px; max-width: 480px; }
  .spinner {
    width: 32px; height: 32px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    margin: 0 auto 20px; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-box {
    margin-top: 16px; background: var(--surface); border: 1px solid var(--border);
    padding: 16px 20px; border-radius: 8px; max-width: 520px;
    font-family: 'Geist Mono', monospace; font-size: 12px; color: var(--negative);
    text-align: left; white-space: pre-wrap; word-break: break-word;
  }
  .retry-btn {
    margin-top: 16px; background: var(--text-1); color: #fff; border: none;
    padding: 10px 18px; border-radius: 6px; font-family: inherit; font-size: 13px; cursor: pointer;
  }
  .retry-btn:hover { background: var(--text-2); }

  /* TOP BAR */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 28px; border-bottom: 1px solid var(--border); margin-bottom: 24px;
  }
  .brand { display: flex; align-items: baseline; gap: 14px; }
  .brand-mark {
    width: 28px; height: 28px; border-radius: 7px;
    background: linear-gradient(135deg, var(--text-1), var(--text-2));
    display: inline-grid; place-items: center; color: #fff;
    font-weight: 600; font-size: 13px; transform: translateY(4px);
  }
  .brand-title { font-size: 15px; font-weight: 500; letter-spacing: -0.01em; }
  .brand-sub   { font-size: 13px; color: var(--text-3); }
  .topbar-right { display: flex; align-items: center; gap: 20px; font-size: 12px; color: var(--text-3); }
  .live-dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--positive); margin-right: 6px; animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* MATURITY */
  .maturity {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 18px 22px; display: grid; grid-template-columns: 1fr auto;
    gap: 24px; align-items: center; margin-bottom: 20px; box-shadow: var(--shadow-sm);
  }
  .maturity-label { font-size: 12px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 500; margin-bottom: 6px; }
  .maturity-text { font-size: 14px; color: var(--text-1); }
  .maturity-text .highlight { background: var(--warning-soft); color: var(--warning); padding: 2px 8px; border-radius: 4px; font-weight: 500; font-size: 12px; margin-right: 8px; }
  .maturity-text .highlight.mature { background: var(--accent-soft); color: var(--accent); }
  .maturity-bar-wrap { width: 280px; }
  .maturity-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-3); margin-bottom: 6px; }
  .maturity-bar { height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
  .maturity-bar-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.8s cubic-bezier(.4,0,.2,1); }

  /* FILTER BAR */
  .filter-area { margin-bottom: 24px; display: flex; flex-direction: column; gap: 8px; }
  .porte-filter-bar {
    display: flex; align-items: center; gap: 16px; padding: 10px 14px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-sm);
  }
  .filter-label { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 500; padding-left: 4px; white-space: nowrap; }
  .porte-tabs { display: flex; gap: 4px; flex: 1; }
  .porte-tab {
    padding: 7px 14px; font-size: 13px; font-family: inherit; color: var(--text-3);
    background: transparent; border: none; border-radius: 7px; cursor: pointer; transition: all 0.15s;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .porte-tab:hover { background: var(--surface-2); color: var(--text-2); }
  .porte-tab.active { background: var(--text-1); color: #fff; }
  .porte-tab.active .porte-count { color: rgba(255,255,255,0.6); }
  .porte-count { font-size: 11px; color: var(--text-4); }

  .dim-filter-bar {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-sm);
    flex-wrap: wrap;
  }
  .dim-select-wrap { display: flex; align-items: center; gap: 8px; }
  .dim-select {
    appearance: none; -webkit-appearance: none;
    background: var(--surface-2) url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%23A8A29E' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E") no-repeat right 10px center;
    border: 1px solid var(--border); border-radius: 7px; padding: 7px 28px 7px 12px;
    font-family: inherit; font-size: 12px; color: var(--text-2); cursor: pointer;
    min-width: 140px; max-width: 200px;
  }
  .dim-select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .filter-sep { width: 1px; height: 20px; background: var(--border); }
  .clear-filters-btn {
    font-size: 11px; color: var(--text-4); background: none; border: none; cursor: pointer;
    padding: 4px 8px; border-radius: 5px; font-family: inherit;
  }
  .clear-filters-btn:hover { color: var(--text-2); background: var(--surface-2); }
  .filter-summary {
    font-size: 11px; color: var(--text-3); padding: 0 4px;
    display: flex; align-items: center; gap: 8px;
  }
  .active-filter-pill {
    background: var(--accent-soft); color: var(--accent); border-radius: 4px;
    padding: 2px 8px; font-size: 11px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px;
  }
  .active-filter-pill button { background: none; border: none; cursor: pointer; color: var(--accent); font-size: 12px; line-height: 1; padding: 0; }

  /* SECTION */
  .section-header {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 16px; margin-top: 40px;
  }
  .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-3); font-weight: 500; }
  .section-sub { font-size: 12px; color: var(--text-4); }

  /* KPIs */
  .kpi-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .kpi {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 20px 22px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column;
    gap: 10px; min-height: 132px; transition: border-color 0.15s, transform 0.15s;
  }
  .kpi:hover { border-color: var(--border-strong); transform: translateY(-1px); }
  .kpi-label { font-size: 12px; color: var(--text-3); display: flex; align-items: center; gap: 6px; }
  .kpi-tag {
    font-size: 9px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em;
    padding: 2px 6px; border-radius: 3px; background: var(--accent-soft); color: var(--accent);
  }
  .kpi-value { font-size: 36px; letter-spacing: -0.03em; line-height: 1; margin-top: auto; }
  .kpi-value.muted { color: var(--text-4); }
  .kpi-value small { font-size: 18px; color: var(--text-3); margin-left: 2px; }
  .kpi-delta { font-size: 12px; color: var(--text-3); display: flex; align-items: center; gap: 6px; }
  .delta-up { color: var(--positive); }
  .delta-down { color: var(--negative); }
  .kpi-muted { color: var(--text-4); font-size: 13px; }

  /* FUNNEL */
  .funnel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .funnel-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 24px 26px; box-shadow: var(--shadow-sm);
  }
  .funnel-title { font-size: 13px; font-weight: 500; margin-bottom: 4px; }
  .funnel-caption { font-size: 12px; color: var(--text-3); margin-bottom: 18px; }
  .funnel-legend { display: flex; gap: 18px; font-size: 11px; color: var(--text-3); margin-bottom: 16px; }
  .legend-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .legend-cortex   { background: var(--accent); }
  .legend-baseline { background: var(--text-4); }
  .stage-row {
    display: grid; grid-template-columns: 170px 1fr 70px;
    align-items: center; gap: 12px; padding: 9px 0;
    border-bottom: 1px solid var(--border); font-size: 13px;
  }
  .stage-row:last-child { border-bottom: none; }
  .stage-row.sao-divider { border-top: 1px dashed var(--accent); margin-top: 2px; padding-top: 12px; }
  .stage-name { color: var(--text-2); }
  .stage-count-sm { color: var(--text-4); font-size: 11px; }
  .stage-bars { display: flex; flex-direction: column; gap: 4px; }
  .stage-bar-row { display: grid; grid-template-columns: 1fr 44px; gap: 8px; align-items: center; }
  .bar-outer { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
  .bar-inner { height: 100%; border-radius: 3px; transition: width 0.8s cubic-bezier(.4,0,.2,1); }
  .bar-cortex   { background: var(--accent); }
  .bar-baseline { background: var(--text-4); opacity: 0.5; }
  .bar-label { font-size: 11px; color: var(--text-3); text-align: right; }
  .stage-rate { font-size: 13px; font-weight: 500; text-align: right; color: var(--text-1); }
  .stage-rate.positive { color: var(--positive); }
  .stage-rate.negative { color: var(--negative); }
  .stage-rate .delta { display: block; font-size: 10px; font-weight: 400; margin-top: 2px; }
  .lost-row {
    margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border);
    font-size: 11px; color: var(--text-4); display: flex; gap: 16px;
  }

  /* LOSS ANALYSIS */
  .loss-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .loss-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 24px 26px; box-shadow: var(--shadow-sm);
  }
  .loss-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 20px; }
  .loss-total { font-family: 'Fraunces', serif; font-size: 42px; letter-spacing: -0.03em; line-height: 1; }
  .loss-total.zero { color: var(--text-4); }
  .loss-sub { font-size: 12px; color: var(--text-3); margin-top: 4px; }
  .loss-bar-list { display: flex; flex-direction: column; gap: 12px; }
  .loss-bar-row { display: grid; grid-template-columns: 140px 1fr 40px; gap: 10px; align-items: center; font-size: 12px; }
  .loss-bar-label { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .loss-bar-outer { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
  .loss-bar-fill  { height: 100%; background: var(--negative); border-radius: 4px; opacity: 0.6; transition: width 0.7s cubic-bezier(.4,0,.2,1); }
  .loss-bar-fill.reason { background: var(--warning); }
  .loss-count { text-align: right; color: var(--text-3); font-size: 11px; }

  /* VELOCITY */
  .velocity-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 24px 26px; box-shadow: var(--shadow-sm);
  }
  .velocity-grid { display: grid; grid-template-columns: repeat(11, 1fr); gap: 8px; margin-top: 20px; overflow-x: auto; }
  .velocity-col { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; }
  .velocity-stage { font-size: 10px; color: var(--text-3); text-align: center; height: 32px; line-height: 1.2; overflow: hidden; }
  .velocity-bar-container { display: flex; flex-direction: column; gap: 3px; align-items: center; width: 100%; }
  .velocity-bar { width: 100%; max-width: 24px; background: var(--accent); border-radius: 2px; }
  .velocity-bar.baseline { background: var(--text-4); opacity: 0.4; }
  .velocity-bar.empty    { opacity: 0.2; }
  .velocity-value { font-size: 11px; color: var(--text-2); font-weight: 500; }
  .velocity-value.muted { color: var(--text-4); }
  .velocity-value small  { color: var(--text-4); font-weight: 400; font-size: 10px; }

  /* CADENCES CHART */
  .cadence-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 28px 30px; box-shadow: var(--shadow-sm);
  }
  .cadence-stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 28px;
    padding-bottom: 24px; margin-bottom: 28px; border-bottom: 1px solid var(--border);
  }
  .cadence-stat-label {
    font-size: 11px; color: var(--text-3); text-transform: uppercase;
    letter-spacing: 0.08em; font-weight: 500; margin-bottom: 10px;
  }
  .cadence-stat-value { font-size: 32px; letter-spacing: -0.025em; line-height: 1; display: flex; align-items: baseline; gap: 8px; }
  .cadence-stat-value.muted { color: var(--text-4); }
  .cadence-stat-value.pos   { color: var(--positive); }
  .cadence-stat-value.neg   { color: var(--negative); }
  .cadence-stat-meta { font-size: 12px; color: var(--text-4); font-family: 'Geist'; font-weight: 400; letter-spacing: 0; }
  .cadence-arrow { font-size: 22px; line-height: 1; }
  .cadence-chart-wrap { overflow-x: auto; padding: 0 4px; }
  .cadence-empty { font-size: 13px; color: var(--text-4); text-align: center; padding: 48px 0; }
  .cad-bar { transition: opacity 0.18s; }
  .cad-bar:hover { opacity: 0.78; }
  .cad-bar-zero { fill: var(--surface-2); }
  .cad-grid-line { stroke: var(--border); stroke-width: 1; stroke-dasharray: 2 4; opacity: 0.6; }
  .cad-baseline { stroke: var(--text-3); stroke-width: 1.5; opacity: 0.4; }
  .cad-axis-val { font-size: 10px; fill: var(--text-4); font-family: 'Geist Mono', monospace; }
  .cad-week-lbl { font-size: 11px; fill: var(--text-2); font-weight: 500; font-family: Geist, sans-serif; }
  .cad-week-date { font-size: 9px; fill: var(--text-4); font-family: Geist, sans-serif; letter-spacing: 0.02em; }
  .cad-count-lbl { font-size: 13px; fill: var(--text-1); font-weight: 500; font-family: 'Fraunces', serif; }
  .cad-count-zero { font-size: 10px; fill: var(--text-4); font-family: 'Geist Mono', monospace; }
  .cad-peak-mark { fill: var(--warning); }

  /* DUAL GRID */
  .dual-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

  /* SEGMENTS */
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 24px 26px; box-shadow: var(--shadow-sm);
  }
  .card-title { font-size: 13px; font-weight: 500; margin-bottom: 4px; }
  .card-sub   { font-size: 12px; color: var(--text-3); margin-bottom: 20px; }
  .segments { display: flex; flex-direction: column; gap: 14px; }
  .segment-row { display: grid; grid-template-columns: 110px 1fr 50px; gap: 12px; align-items: center; font-size: 13px; }
  .segment-label { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .segment-bar { height: 10px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
  .segment-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.8s cubic-bezier(.4,0,.2,1); }
  .segment-count { text-align: right; color: var(--text-3); font-size: 12px; }

  /* TEAM */
  .team-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  table.perf { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 14px; }
  table.perf th {
    text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-4); font-weight: 500; padding: 10px 12px; border-bottom: 1px solid var(--border);
  }
  table.perf th:last-child, table.perf td:last-child { text-align: right; }
  table.perf td { padding: 12px 12px; border-bottom: 1px solid var(--border); color: var(--text-2); }
  table.perf tr:last-child td { border-bottom: none; }
  table.perf tr:hover td { background: var(--surface-2); }
  .person { display: flex; align-items: center; gap: 10px; }
  .avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-size: 10px; color: var(--text-2); font-weight: 500; }
  .perf-mini-bar { display: inline-block; width: 60px; height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; vertical-align: middle; margin-right: 8px; }
  .perf-mini-bar-fill { height: 100%; background: var(--accent); border-radius: 2px; }
  .rate-pill { font-size: 12px; font-weight: 500; }
  .empty-row td { color: var(--text-4); text-align: center; padding: 24px; font-size: 12px; }

  /* FOOTER */
  .footer {
    margin-top: 60px; padding-top: 24px; border-top: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--text-4);
  }

  .fade-in { animation: fadeUp 0.35s cubic-bezier(.4,0,.2,1) backwards; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  @media (max-width: 1100px) {
    .app { padding: 24px 20px 60px; }
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .funnel-grid, .dual-grid, .team-grid, .loss-grid { grid-template-columns: 1fr; }
    .velocity-grid { min-width: 700px; }
  }
</style>
</head>
<body>
<div id="root">
  <div class="state-screen">
    <div>
      <div class="spinner"></div>
      <div class="title serif">Carregando painel…</div>
      <div class="sub">Buscando dados mais recentes da campanha</div>
    </div>
  </div>
</div>

<script>
// ============================================================================
// PAINEL CORTEX v3 — filtros dinâmicos + análise de perdas + cadências
// ============================================================================

const DATA_URL = './data.json';

// Stage IDs (devem bater com o n8n Compute Metrics)
const STAGES_SDR = [
  { id: '72557853',  name: 'Mapeamento' },
  { id: '24595558',  name: 'Abordar' },
  { id: '24595559',  name: 'Em cadência' },
  { id: '24595562',  name: 'Lead Conectado' },
  { id: '24595560',  name: 'Qual. Agendada' },
  { id: '24595561',  name: 'Qual. Realizada' },
  { id: '9102669',   name: 'SAO' },
];
const STAGES_OPP = [
  { id: '9102669',               name: 'SAO' },
  { id: 'presentationscheduled', name: 'Elab. Proposta' },
  { id: '11505970',              name: 'Proposta Enviada' },
  { id: 'decisionmakerboughtin', name: 'Em negociação' },
  { id: '26183057',              name: 'Proposta Aceita' },
];
const STAGE_SDR_LOST = '24595564';
const STAGE_OPP_LOST = 'closedlost';

// ---- State ---------------------------------------------------------------
let gData = null;
const filters = { porte: 'all', setor: 'all', cn: 'all', ev: 'all', campanha: 'all' };

// ---- Formatters ----------------------------------------------------------
const DASH = '—';
const isNil = v => v === null || v === undefined || (typeof v === 'number' && !isFinite(v));

function fmt(v, type = 'auto') {
  if (isNil(v)) return DASH;
  switch (type) {
    case 'int':  return Number(v).toLocaleString('pt-BR');
    case 'pct':  return `${(Number(v) * 100).toFixed(1).replace('.', ',')}%`;
    case 'pp': {
      const pp = Number(v) * 100;
      const sign = pp > 0.001 ? '+' : pp < -0.001 ? '−' : '';
      return `${sign}${Math.abs(pp).toFixed(1).replace('.', ',')} pp`;
    }
    case 'days':       return `${Number(v).toFixed(1).replace('.', ',')}d`;
    case 'multiplier': return `${Number(v).toFixed(1).replace('.', ',')}x`;
    default: return String(v);
  }
}

function fmtDate(iso) {
  if (!iso) return DASH;
  const d = new Date(iso);
  const months = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  return `${String(d.getDate()).padStart(2,'0')} ${months[d.getMonth()]} ${d.getFullYear()} · ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function timeAgo(iso) {
  if (!iso) return DASH;
  const mins = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 1) return 'agora mesmo';
  if (mins < 60) return `há ${mins} min`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `há ${hrs} h`;
  return `há ${Math.floor(hrs / 24)} d`;
}
function weekLabel(wk) {
  // "2026-W14" → "S14"
  const [, w] = wk.split('-W');
  return `S${w}`;
}

// "2026-W14" → start (Mon) and end (Sun) Date objects
function isoWeekToDates(wk) {
  const [yr, w] = wk.split('-W').map(Number);
  // Monday of ISO week 1: the Monday on or before Jan 4
  const jan4 = new Date(yr, 0, 4);
  const jan4Day = (jan4.getDay() + 6) % 7; // 0 = Mon
  const week1Mon = new Date(jan4);
  week1Mon.setDate(jan4.getDate() - jan4Day);
  // Target week's Monday
  const start = new Date(week1Mon);
  start.setDate(week1Mon.getDate() + (w - 1) * 7);
  const end = new Date(start);
  end.setDate(start.getDate() + 6);
  return { start, end };
}
function fmtDayMonth(d) {
  const months = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  return `${String(d.getDate()).padStart(2,'0')} ${months[d.getMonth()]}`;
}
function isoWeekRangeLabel(wk) {
  const { start, end } = isoWeekToDates(wk);
  // If same month, show "06–12 abr"; else "30 mar–05 abr"
  const months = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  const sd = String(start.getDate()).padStart(2,'0');
  const ed = String(end.getDate()).padStart(2,'0');
  if (start.getMonth() === end.getMonth()) {
    return `${sd}–${ed} ${months[end.getMonth()]}`;
  }
  return `${sd} ${months[start.getMonth()]}–${ed} ${months[end.getMonth()]}`;
}

// Fill missing weeks with zero counts between min and max week (same year)
function fillWeekGaps(weekly) {
  if (weekly.length === 0) return [];
  const sorted = [...weekly].sort((a, b) => a.week.localeCompare(b.week));
  const map = Object.fromEntries(sorted.map(w => [w.week, w.count]));
  const [startYr, startW] = sorted[0].week.split('-W').map(Number);
  const [endYr, endW]     = sorted[sorted.length - 1].week.split('-W').map(Number);
  if (startYr !== endYr) return sorted; // cross-year, just use what we have

  // How many ISO weeks does this year have?
  const dec28 = new Date(startYr, 11, 28);
  const day28 = (dec28.getDay() + 6) % 7;
  const lastWeekMon = new Date(dec28); lastWeekMon.setDate(dec28.getDate() - day28);
  const jan4 = new Date(startYr, 0, 4);
  const jan4Day = (jan4.getDay() + 6) % 7;
  const week1Mon = new Date(jan4); week1Mon.setDate(jan4.getDate() - jan4Day);
  const totalWeeks = Math.round((lastWeekMon - week1Mon) / 604800000) + 1;

  const out = [];
  for (let w = startW; w <= endW; w++) {
    if (w > totalWeeks) break;
    const key = `${startYr}-W${String(w).padStart(2, '0')}`;
    out.push({ week: key, count: map[key] || 0 });
  }
  return out;
}
function initialsOf(name) {
  if (!name) return '?';
  const parts = name.split(' ').filter(Boolean);
  return ((parts[0]?.[0] || '') + (parts[parts.length - 1]?.[0] || '')).toUpperCase().slice(0, 2) || '?';
}

function applyFilters(deals) {
  return deals.filter(d => {
    if (filters.porte !== 'all' && d.porte !== filters.porte) return false;
    if (filters.setor !== 'all' && d.setor !== filters.setor) return false;
    if (filters.cn !== 'all' && d.cn !== filters.cn) return false;
    if (filters.ev !== 'all' && d.ev !== filters.ev) return false;
    if (filters.campanha !== 'all' && d.campanha !== filters.campanha) return false;
    return true;
  });
}

// ---- Compute metrics from deal array -------------------------------------
function computeMetrics(deals, baseline) {
  const total = deals.length;

  // SDR funnel
  const sdrFunnel = STAGES_SDR.map((s, i) => {
    const count = deals.filter(d => d.stages[s.id]).length;
    const prevCount = i === 0 ? total : deals.filter(d => d.stages[STAGES_SDR[i-1].id]).length;
    return {
      stage: s.name, count,
      rateFromPrev: i === 0 ? 1 : (prevCount > 0 ? count / prevCount : 0),
      rateFromTop:  total > 0 ? count / total : 0
    };
  });
  const sdrLost = deals.filter(d => d.stages[STAGE_SDR_LOST]).length;

  // OPP funnel
  const saoDeals  = deals.filter(d => d.stages['9102669']);
  const saoCount  = saoDeals.length;
  const oppFunnel = STAGES_OPP.map((s, i) => {
    const count = deals.filter(d => d.stages[s.id]).length;
    const prevCount = i === 0 ? saoCount : deals.filter(d => d.stages[STAGES_OPP[i-1].id]).length;
    return {
      stage: s.name, count,
      rateFromPrev: i === 0 ? 1 : (prevCount > 0 ? count / prevCount : 0),
      rateFromTop:  saoCount > 0 ? count / saoCount : 0
    };
  });
  const oppLost = deals.filter(d => d.stages[STAGE_OPP_LOST]).length;

  // KPIs
  const qualified     = deals.filter(d => d.stages['24595561']).length;
  const closed        = deals.filter(d => d.stages['26183057']).length;
  const closedRevenue = deals.filter(d => d.stages['26183057']).reduce((s, d) => s + (d.amount || 0), 0);
  const pipelineValue = deals.filter(d => d.stages['9102669'] && !d.stages['26183057'] && !d.stages[STAGE_OPP_LOST])
                             .reduce((s, d) => s + (d.amount || 0), 0);

  // Loss analysis
  const lostDeals = deals.filter(d => d.isLost);
  const byStage   = {};
  const byReason  = {};
  lostDeals.forEach(d => {
    const st = d.lostStage   || '— desconhecido';
    const r  = d.lostReason  || '— sem motivo registrado';
    byStage[st] = (byStage[st] || 0) + 1;
    byReason[r] = (byReason[r] || 0) + 1;
  });

  // Weekly cadences (entries into "Em cadência" stage per ISO week)
  const cadWeeks = {};
  deals.forEach(d => {
    const dt = d.stages['24595559'];
    if (dt) {
      const wk = toISOWeek(dt);
      cadWeeks[wk] = (cadWeeks[wk] || 0) + 1;
    }
  });

  // Segments
  const byPorte = groupBy(deals, d => d.porte || '— sem porte');
  const bySetor = groupBy(deals, d => d.setor  || '— sem categoria');

  // Team
  const cnMap = {};
  deals.forEach(d => {
    if (!d.cn) return;
    if (!cnMap[d.cn]) cnMap[d.cn] = { name: d.cn, leads: 0, qualified: 0 };
    cnMap[d.cn].leads++;
    if (d.stages['24595561']) cnMap[d.cn].qualified++;
  });
  const cns = Object.values(cnMap).map(c => ({ ...c, rate: c.leads > 0 ? c.qualified / c.leads : 0 }))
                                  .sort((a, b) => b.leads - a.leads);

  const evMap = {};
  deals.filter(d => d.stages['9102669'] && d.ev).forEach(d => {
    if (!evMap[d.ev]) evMap[d.ev] = { name: d.ev, opportunities: 0, pipeline: 0 };
    if (!d.stages['26183057'] && !d.stages[STAGE_OPP_LOST]) {
      evMap[d.ev].opportunities++;
      evMap[d.ev].pipeline += (d.amount || 0);
    }
  });
  const evs = Object.values(evMap).sort((a, b) => b.pipeline - a.pipeline);

  return {
    total,
    kpis: {
      leadsTotal:    total,
      qualified,
      qualifiedRate: total > 0 ? qualified / total : 0,
      inOpportunity: saoCount,
      pipelineValue,
      closed,
      closedRevenue,
    },
    funnel: {
      sdr: { cortex: sdrFunnel, baseline: baseline?.funnel?.sdr || [], cortexLost: sdrLost },
      opp: { cortex: oppFunnel, baseline: baseline?.funnel?.opp || [], cortexLost: oppLost }
    },
    losses: {
      total: lostDeals.length,
      rate: total > 0 ? lostDeals.length / total : 0,
      byStage:  Object.entries(byStage).map(([stage,  count]) => ({ stage,  count })).sort((a,b) => b.count - a.count),
      byReason: Object.entries(byReason).map(([reason, count]) => ({ reason, count })).sort((a,b) => b.count - a.count),
    },
    cadences: {
      weekly: Object.entries(cadWeeks).sort(([a],[b]) => a.localeCompare(b)).map(([week, count]) => ({ week, count }))
    },
    velocity: baseline?.velocity || { stages: [] },
    segments: { byPorte, bySetor: bySetor.slice(0, 6) },
    team: { cns, evs }
  };
}

function groupBy(deals, keyFn) {
  const acc = {};
  deals.forEach(d => { const k = keyFn(d); acc[k] = (acc[k] || 0) + 1; });
  return Object.entries(acc).map(([name, count]) => ({ name, count })).sort((a,b) => b.count - a.count);
}

function toISOWeek(dateStr) {
  const d = new Date(dateStr);
  const thr = new Date(d);
  thr.setDate(d.getDate() - ((d.getDay() + 6) % 7) + 3);
  const yr  = thr.getFullYear();
  const jan4 = new Date(yr, 0, 4);
  const wk  = 1 + Math.round((thr - jan4) / 604800000);
  return `${yr}-W${String(wk).padStart(2,'0')}`;
}

function renderFunnelCard(title, caption, cortex, baseline, cortexLost, saoIsLast) {
  const bTotal = baseline[0]?.count || 1;

  const rows = cortex.map((c, i) => {
    const bl           = baseline[i] || {};
    const baselineTop  = bl.rateFromTop ?? 0;
    const cortexTop    = c.rateFromTop;
    const delta        = (!isNil(cortexTop) && !isNil(baselineTop)) ? cortexTop - baselineTop : null;
    const deltaClass   = delta === null ? '' : delta > 0.01 ? 'positive' : delta < -0.01 ? 'negative' : '';
    const isSaoRow     = saoIsLast && i === cortex.length - 1;

    return `
      <div class="stage-row${isSaoRow ? ' sao-divider' : ''}">
        <div class="stage-name">${c.stage}<div class="stage-count-sm">${fmt(c.count, 'int')} deals · baseline: ${fmt(bl.count, 'int')}</div></div>
        <div class="stage-bars">
          <div class="stage-bar-row">
            <div class="bar-outer"><div class="bar-inner bar-cortex"   style="width:${Math.min(100,(cortexTop||0)*100)}%"></div></div>
            <div class="bar-label">${fmt(cortexTop, 'pct')}</div>
          </div>
          <div class="stage-bar-row">
            <div class="bar-outer"><div class="bar-inner bar-baseline" style="width:${Math.min(100,(baselineTop||0)*100)}%"></div></div>
            <div class="bar-label">${fmt(baselineTop, 'pct')}</div>
          </div>
        </div>
        <div class="stage-rate ${deltaClass}">${i === 0 ? DASH : fmt(delta, 'pp')}${i === 0 ? '' : '<span class="delta">vs. baseline</span>'}</div>
      </div>`;
  }).join('');

  return `
    <div class="funnel-card fade-in">
      <div class="funnel-title">${title}</div>
      <div class="funnel-caption">${caption}</div>
      <div class="funnel-legend">

      ${rows}

        <span>Cortex: <strong>${fmt(cortexLost, 'int')}</strong> perdidos</span>

}

function renderVelocity(velocity) {
  const stages = velocity.stages || [];
  if (stages.length === 0) return '';

  const allVals = stages.flatMap(s => [s.cortexDays, s.avgDays]).filter(x => x !== null && x !== undefined && x > 0);
  const maxV = allVals.length ? Math.max(...allVals) : 1;
  const scale = 120;

  const cols = stages.map(s => {
    const cH = (s.cortexDays !== null && s.cortexDays !== undefined && s.cortexDays > 0)
      ? Math.max(4, (s.cortexDays / maxV) * scale) : 0;
    const bH = (s.avgDays !== null && s.avgDays !== undefined && s.avgDays > 0)
      ? Math.max(4, (s.avgDays / maxV) * scale) : 0;
    return `
      <div class="velocity-col">
        <div class="velocity-bar-container">
          ${cH > 0 ? `<div class="velocity-bar" style="height:${cH}px"></div>` : `<div class="velocity-bar empty" style="height:12px"></div>`}
          <div class="velocity-value ${cH === 0 ? 'muted' : ''}">${cH > 0 ? fmt(s.cortexDays, 'days') : DASH}</div>
          <div class="velocity-bar baseline" style="height:${Math.max(4, bH)}px"></div>
          <div class="velocity-value"><small>${fmt(s.avgDays, 'days')}</small></div>
        </div>
        <div class="velocity-stage">${s.name}</div>
      </div>`;
  }).join('');

  return `
    <div class="section-header">
      <div class="section-title">Velocidade do funil</div>
      <div class="section-sub">Dias médios por stage · barra verde = Cortex · cinza = Carteira 2025 · menor é melhor</div>
    </div>
    <div class="velocity-card fade-in">
      <div class="funnel-legend">
        <span><span class="legend-dot legend-cortex"></span>Cortex</span>
        <span><span class="legend-dot legend-baseline"></span>Carteira 2025</span>
        <span style="margin-left:auto;color:var(--text-4)">menor é melhor</span>
      </div>
      <div class="velocity-grid">${cols}</div>
    </div>`;
}

function renderCadences(m) {
  const rawWeekly = m.cadences?.weekly || [];

  if (rawWeekly.length === 0) {
    return `
      <div class="section-header">
        <div class="section-title">Ritmo de cadências</div>
        <div class="section-sub">Quantos deals entraram em "Em cadência" por semana ISO</div>
      </div>
      <div class="cadence-card fade-in">
        <div class="cadence-empty">Nenhuma entrada em cadência registrada neste recorte</div>
      </div>`;
  }

  // Fill week gaps for visual continuity
  const weekly = fillWeekGaps(rawWeekly);

  // Stats
  const total       = weekly.reduce((s, w) => s + w.count, 0);
  const nonZero     = weekly.filter(w => w.count > 0);
  const max         = Math.max(...weekly.map(w => w.count), 1);
  const avg         = nonZero.length > 0 ? total / nonZero.length : 0;
  const peak        = weekly.reduce((acc, w) => w.count > acc.count ? w : acc, weekly[0]);
  const last        = weekly[weekly.length - 1];
  const prev        = weekly[weekly.length - 2] || null;
  const wow         = (prev && prev.count > 0) ? ((last.count - prev.count) / prev.count) : null;

  // SVG layout
  const PAD_LEFT = 32, PAD_RIGHT = 12, PAD_TOP = 28, CHART_H = 200, LABEL_H = 56;
  const BAR_W   = 48, BAR_GAP = 22;
  const innerW  = weekly.length * (BAR_W + BAR_GAP) + BAR_GAP;
  const svgW    = PAD_LEFT + innerW + PAD_RIGHT;
  const svgH    = PAD_TOP + CHART_H + LABEL_H;

  // Y-axis grid (4 ticks at 25/50/75/100% of max)
  const niceMax = (() => {
    // Round up max to a nice number
    if (max <= 5)  return 5;
    if (max <= 10) return 10;
    if (max <= 20) return 20;
    if (max <= 50) return Math.ceil(max / 5) * 5;
    return Math.ceil(max / 10) * 10;
  })();

  const ticks  = [1, 0.75, 0.5, 0.25, 0];
  const grid   = ticks.map(t => {
    const y   = PAD_TOP + (1 - t) * CHART_H;
    const val = Math.round(niceMax * t);
    return `
      <line class="cad-grid-line" x1="${PAD_LEFT}" y1="${y}" x2="${svgW - PAD_RIGHT}" y2="${y}"/>
      <text class="cad-axis-val" x="${PAD_LEFT - 6}" y="${y + 3}" text-anchor="end">${val}</text>`;
  }).join('');

  const baseY = PAD_TOP + CHART_H;

  // Bars
  const bars = weekly.map((w, i) => {
    const x   = PAD_LEFT + BAR_GAP + i * (BAR_W + BAR_GAP);
    const cx  = x + BAR_W / 2;
    const isZero  = w.count === 0;
    const isPeak  = !isZero && w.count === peak.count;
    const barH    = isZero ? 4 : Math.max(6, (w.count / niceMax) * CHART_H);
    const y       = baseY - barH;
    const dateLbl = isoWeekRangeLabel(w.week);
    const wkLbl   = weekLabel(w.week);

    if (isZero) {
      return `
        <g>
          <rect class="cad-bar cad-bar-zero" x="${x}" y="${y}" width="${BAR_W}" height="${barH}" rx="2" ry="2"/>
          <text class="cad-count-zero" x="${cx}" y="${y - 6}" text-anchor="middle">0</text>
          <text class="cad-week-lbl"  x="${cx}" y="${baseY + 22}" text-anchor="middle" opacity="0.6">${wkLbl}</text>
          <text class="cad-week-date" x="${cx}" y="${baseY + 38}" text-anchor="middle" opacity="0.6">${dateLbl}</text>
        </g>`;
    }
    return `
      <g>
        <rect class="cad-bar" x="${x}" y="${y}" width="${BAR_W}" height="${barH}" rx="4" ry="4" fill="url(#cad-grad)"/>
        ${isPeak ? `<circle class="cad-peak-mark" cx="${cx}" cy="${y - 18}" r="3.5"/>` : ''}
        <text class="cad-count-lbl" x="${cx}" y="${y - 8}" text-anchor="middle">${w.count}</text>
        <text class="cad-week-lbl"  x="${cx}" y="${baseY + 22}" text-anchor="middle">${wkLbl}</text>
        <text class="cad-week-date" x="${cx}" y="${baseY + 38}" text-anchor="middle">${dateLbl}</text>
      </g>`;
  }).join('');

  // Stat formatter
  const wowDisplay = wow === null
    ? `<span class="cadence-stat-value muted serif">—<span class="cadence-stat-meta">sem comparação</span></span>`
    : `<span class="cadence-stat-value serif ${wow > 0 ? 'pos' : wow < 0 ? 'neg' : ''}">
         <span class="cadence-arrow">${wow > 0 ? '↑' : wow < 0 ? '↓' : '–'}</span>
         ${Math.abs(wow * 100).toFixed(0)}%
         <span class="cadence-stat-meta">vs. ${weekLabel(prev.week)}</span>
       </span>`;

  return `
    <div class="section-header">
      <div class="section-title">Ritmo de cadências</div>
      <div class="section-sub">Quantos deals entraram em "Em cadência" por semana ISO</div>
    </div>
    <div class="cadence-card fade-in">
      <div class="cadence-stats">
        <div>
          <div class="cadence-stat-label">Total no período</div>
          <span class="cadence-stat-value serif">${fmt(total, 'int')}<span class="cadence-stat-meta">deals em cadência</span></span>
        </div>
        <div>
          <div class="cadence-stat-label">Pico semanal</div>
          <span class="cadence-stat-value serif">${peak.count}<span class="cadence-stat-meta">na ${weekLabel(peak.week)} · ${isoWeekRangeLabel(peak.week)}</span></span>
        </div>
        <div>
          <div class="cadence-stat-label">Média semanal</div>
          <span class="cadence-stat-value serif">${avg.toFixed(1).replace('.', ',')}<span class="cadence-stat-meta">semanas com atividade</span></span>
        </div>
        <div>
          <div class="cadence-stat-label">Última vs. anterior</div>
          ${wowDisplay}
        </div>
      </div>
      <div class="cadence-chart-wrap">
        <svg width="${svgW}" height="${svgH}" viewBox="0 0 ${svgW} ${svgH}" xmlns="http://www.w3.org/2000/svg" style="min-width:${svgW}px">
          <defs>
            <linearGradient id="cad-grad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"   stop-color="var(--accent)" stop-opacity="0.95"/>
              <stop offset="100%" stop-color="var(--accent)" stop-opacity="0.55"/>
            </linearGradient>
          </defs>
          ${grid}
          <line class="cad-baseline" x1="${PAD_LEFT}" y1="${baseY}" x2="${svgW - PAD_RIGHT}" y2="${baseY}"/>
          ${bars}
        </svg>
      </div>
    </div>`;
}

function renderSegments(m, data) {
  const s      = m.segments;
  const total  = m.total || 1;

  const showPorte = filters.porte === 'all' && s.byPorte.length > 0;
  const PORTE_ORDER = ['P', 'M', 'G+'];
  const sortedPorte = [...s.byPorte].sort((a, b) => {
    const ia = PORTE_ORDER.indexOf(a.name), ib = PORTE_ORDER.indexOf(b.name);
    return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
  });

  const makeRows = (arr, maxCount) => arr.map(r => `
    <div class="segment-row">
      <div class="segment-label" title="${r.name}">${r.name}</div>
      <div class="segment-bar"><div class="segment-fill" style="width:${(r.count/(maxCount||1))*100}%"></div></div>
      <div class="segment-count">${fmt(r.count, 'int')}</div>
    </div>`).join('');

  const setorMax = s.bySetor[0]?.count || 1;
  const porteMax = sortedPorte[0]?.count || 1;

  return `
    <div class="card fade-in">
      <div class="card-title">Perfil das empresas</div>
      <div class="card-sub">Distribuição de ${fmt(m.total, 'int')} leads no recorte atual</div>
      ${showPorte ? `
        <div style="font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px">Por porte</div>
        <div class="segments" style="margin-bottom:20px">${makeRows(sortedPorte, porteMax)}</div>
        <div style="font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px;padding-top:18px;border-top:1px solid var(--border)">Por setor</div>
        <div class="segments">${makeRows(s.bySetor, setorMax)}</div>
      ` : `
        <div class="segments">${makeRows(s.bySetor, setorMax)}</div>
      `}
    </div>`;
}

function renderCNTable(cns, suffix) {
  const maxRate = cns.length ? Math.max(...cns.map(c => c.rate || 0), 0.01) : 0.01;
  const rows = cns.length === 0
    ? `<tr class="empty-row"><td colspan="4">Nenhum CN com leads Cortex${suffix}</td></tr>`
    : cns.map(c => `
        <tr>
          <td><div class="person"><div class="avatar">${initialsOf(c.name)}</div>${c.name}</div></td>
          <td>${fmt(c.leads, 'int')}</td>
          <td>${fmt(c.qualified, 'int')}</td>
          <td>
            <span class="perf-mini-bar"><span class="perf-mini-bar-fill" style="width:${((c.rate||0)/maxRate)*100}%"></span></span>
            <span class="rate-pill">${fmt(c.rate, 'pct')}</span>
          </td>
        </tr>`).join('');
  return `
    <div class="card fade-in">
      <div class="card-title">Consultores de Negócio (CN)</div>
      <div class="card-sub">Mapeamento → Qualificação Realizada</div>
      <table class="perf">
        <thead><tr><th>CN</th><th>Leads</th><th>Qualif.</th><th>Taxa</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function renderEVTable(evs, suffix) {
  const rows = evs.length === 0
    ? `<tr class="empty-row"><td colspan="3">Nenhum EV com oportunidades Cortex${suffix}</td></tr>`
    : evs.map(e => `
        <tr>
          <td><div class="person"><div class="avatar">${initialsOf(e.name)}</div>${e.name}</div></td>
          <td>${fmt(e.opportunities, 'int')}</td>
          <td>${fmt(e.pipeline, 'int') === DASH ? DASH : `R$ ${fmt(e.pipeline, 'int')}`}</td>
        </tr>`).join('');
  return `
    <div class="card fade-in">
      <div class="card-title">Executivos de Vendas (EV)</div>
      <div class="card-sub">Oportunidades ativas em pipeline</div>
      <table class="perf">
        <thead><tr><th>EV</th><th>Oport. ativas</th><th>Pipeline</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function renderTeam(m) {
  const suffix = filters.porte !== 'all' ? ` (porte ${filters.porte})` : '';
  return `
    <div class="section-header">
      <div class="section-title">Performance por pessoa</div>
      <div class="section-sub">Quem está capitalizando melhor os leads Cortex</div>
    </div>
    <div class="team-grid">
      ${renderCNTable(m.team.cns, suffix)}
      ${renderEVTable(m.team.evs, suffix)}
    </div>`;
}

function renderFooter(data) {
  const d = data.debug || {};
  const unporte = d.cortexDealsWithoutPorte > 0
    ? ` · ⚠ ${d.cortexDealsWithoutPorte} deals sem porte` : '';
  return `
    <div class="footer">
      <div>Fonte: HubSpot · sync n8n</div>
      <div>${fmt(d.cortexDealsCount,'int')} deals Cortex · ${fmt(d.baselineDealsCount,'int')} Carteira 2025${unporte} · sync a cada 1h</div>
    </div>`;
}

// ---- Main render ---------------------------------------------------------
function render() {
  if (!gData) return;
  const filtered  = applyFilters(gData.deals);
  const baseline  = getBaseline(gData);
  const m         = computeMetrics(filtered, baseline);
  const meta      = gData.meta;

  document.getElementById('root').innerHTML = `
    <div class="app">
      ${renderTopbar(gData)}
      ${renderMaturity(gData)}
      ${renderFilterBar(gData)}
      ${renderKPIs(m, meta)}
      ${renderFunnel(m)}
      ${renderLossAnalysis(m)}
      ${renderVelocity(m.velocity)}
      ${renderCadences(m)}
      <div class="section-header">
        <div class="section-title">Qualidade e perfil</div>
        <div class="section-sub">Segmentação dos ${fmt(m.total, 'int')} leads no recorte</div>
      </div>
      <div class="dual-grid" style="margin-bottom:0">
        ${renderSegments(m, gData)}
        <div><!-- placeholder for future widget --></div>
      </div>
      ${renderTeam(m)}
      ${renderFooter(gData)}
    </div>
  `;

  // Bind porte tabs
  document.querySelectorAll('.porte-tab').forEach(btn => {
    btn.addEventListener('click', () => { filters.porte = btn.dataset.porte; render(); });
  });

  // Bind dimension selects
  document.querySelectorAll('.dim-select').forEach(sel => {
    sel.addEventListener('change', () => { filters[sel.dataset.filter] = sel.value; render(); });
  });

  // Clear filters button
  document.querySelector('.clear-filters-btn')?.addEventListener('click', () => {
    ['setor','cn','ev','campanha'].forEach(k => filters[k] = 'all');
    render();
  });

  // Clear individual pills
  document.querySelectorAll('[data-clear]').forEach(btn => {
    btn.addEventListener('click', () => { filters[btn.dataset.clear] = 'all'; render(); });
  });
}

function renderError(msg) {
  document.getElementById('root').innerHTML = `
    <div class="state-screen">
      <div>
        <div class="title serif">Não foi possível carregar o painel</div>
        <div class="sub">O arquivo <code>data.json</code> não foi encontrado ou tem estrutura inválida.</div>
        <div class="error-box">${msg}</div>
        <button class="retry-btn" onclick="loadData()">Tentar novamente</button>
      </div>
    </div>`;
}

async function loadData() {
  try {
    const resp = await fetch(`${DATA_URL}?t=${Date.now()}`, { cache: 'no-store' });
    if (!resp.ok) throw new Error(`HTTP ${resp.status} ao buscar ${DATA_URL}`);
    const data = await resp.json();
    if (!data.meta || !data.deals || !data.baseline) throw new Error('Estrutura do data.json inválida (esperado: meta, deals, baseline)');
    gData = data;
    render();
  } catch (e) {
    renderError(e.message || String(e));
  }
}

loadData();
setInterval(loadData, 15 * 60 * 1000);
</script>
</body>
